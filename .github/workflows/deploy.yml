# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pick your own package manager and build script
      - run: npm install
      - run: npx nuxt build --preset github_pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public
  # Deployment job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    # Deploy to the github_pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Relief sublabel (relief.mestnostrecords.com): same code built with
  # RELIEF_SITE=1, published to the gh-pages branch of anton-smagin/relief-site.
  # Needs the RELIEF_DEPLOY_KEY secret (private half of a write deploy key on relief-site).
  deploy-relief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx nuxt build --preset github_pages
        env:
          RELIEF_SITE: "1"
      # The build copies public/CNAME (mestnostrecords.com); the cname input
      # below does not replace an existing file, so overwrite it first.
      - run: echo relief.mestnostrecords.com > .output/public/CNAME
      - name: Deploy to relief-site
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.RELIEF_DEPLOY_KEY }}
          external_repository: anton-smagin/relief-site
          publish_branch: gh-pages
          publish_dir: ./.output/public
          cname: relief.mestnostrecords.com
